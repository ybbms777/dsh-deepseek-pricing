name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
        # Versions shipped by @deepseek-ai/dsh@0.0.1-rc.5 and @0.2.0-rc.2.
        # cordis is 4.0.5 on both; dsh-tools matches the dsh version.
        dsh-tools: ['0.0.1-rc.5', '0.2.0-rc.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install peers
        run: npm ci
      - name: Select the dsh-tools line under test
        run: npm install --no-save --package-lock=false @deepseek-ai/dsh-tools@${{ matrix.dsh-tools }} @deepseek-ai/cordis@4.0.5
      - name: Tests (real cordis + tool registry boot, plus the schedule rules)
        run: node --test
      # The rule is arithmetic on instants, so the answer must not depend on where the host
      # thinks it is. One runner, two host zones, identical results. The offset line is printed
      # first: it is what makes this step evidence instead of a no-op when a platform's Node
      # happens to ignore TZ.
      - name: Tests under a UTC host
        env:
          TZ: UTC
        run: |
          node -p "'host zone: ' + process.env.TZ + ' offset=' + (new Date().getTimezoneOffset() / -60)"
          node --test
      - name: Tests under a Beijing host
        env:
          TZ: Asia/Shanghai
        run: |
          node -p "'host zone: ' + process.env.TZ + ' offset=' + (new Date().getTimezoneOffset() / -60)"
          node --test
      - name: Generated core must match the pinned panel commit
        run: node tools/sync-core.mjs --check
