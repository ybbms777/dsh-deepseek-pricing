name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install peers
        run: npm ci
      - name: Tests (real cordis + ToolRegistry boot, plus the schedule rules)
        run: node --test
      - name: Generated core must match the pinned panel commit
        run: node tools/sync-core.mjs --check
